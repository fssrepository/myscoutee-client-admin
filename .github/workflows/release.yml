name: Private Linux release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version
        run: test "$GITHUB_REF_NAME" = v1.0.2
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Package
        run: tools/build_deb.sh
      - name: Publish installer and private documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb docs/admin-client-api.pdf --title "MyScoutee Admin 1.0.2" --notes-file docs/release-1.0.2.md --verify-tag
