<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MyScoutee Admin</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<main><header><div><small>MyScoutee</small><h1>Admin monitor</h1></div><select id="language" aria-label="Language"><option value="en">English</option><option value="hu">Magyar</option></select></header>
<form id="connection"><label><span data-i18n="url"></span><input id="url" type="url" required placeholder="https://example.com/api/admin-client/v1"></label><label><span data-i18n="key"></span><input id="key" type="password" autocomplete="off" required></label><div class="controls"><label class="check"><input id="demo" type="checkbox"><span data-i18n="demo"></span></label><button id="connect" data-i18n="connect"></button><button id="disconnect" type="button" class="secondary" data-i18n="disconnect"></button></div></form>
<div class="poll"><label><span data-i18n="interval"></span><input id="interval" type="number" min="5" max="3600" value="10"></label><button id="apply" class="secondary" data-i18n="apply"></button><a id="open-app" target="_blank" rel="noopener noreferrer" data-i18n="open"></a></div>
<p id="status" role="status"></p><p id="error" role="alert"></p>
<section><h2 data-i18n="profiles"></h2><div class="metrics"><article><strong id="active">—</strong><span data-i18n="active"></span></article><article><strong id="week">—</strong><span data-i18n="week"></span></article><article><strong id="month">—</strong><span data-i18n="month"></span></article></div><p id="genders"></p><small id="snapshot"></small></section>
<section><h2 data-i18n="attention"></h2><dl id="attention"></dl><p id="notification" role="status"></p></section><footer data-i18n="background"></footer></main></body></html>
